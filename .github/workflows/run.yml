name: Run my_pymupdf_end2end

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点击按钮构建

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      test: ${{ steps.filter.outputs.test }}
      action: ${{ steps.filter.outputs.action }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          docker:
            - 'Dockerfile'
          #   - 'requirements.txt'
          # test:
          #   - 'test.sh'
          #   - 'buzzheavier.py'
          #   - 'scanner.py'
          action:
            - '.github/workflows/run.yml'
  # JOB to build and push Docker image
  build-and-push:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 必须赋予写入 Packages 的权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  # JOB to run test script
  test:
    runs-on: ubuntu-latest
    needs: [changes, build-and-push]
    if: |
      always() && 
      (
        needs.build-and-push.result == 'success' ||
        ((needs.changes.outputs.test == 'true' || needs.changes.outputs.action == 'true') && needs.build-and-push.result == 'skipped')
      )

    container:
      image: ghcr.io/liuxunchenglxc/my_pymupdf_end2end:latest
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Df
        run: |
          df -h || true

      - name: Run test script
        run: |
          bash test.sh

